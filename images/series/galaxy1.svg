<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="galaxy1-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0c1938"/>
      <stop offset="75%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="nebula-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1938" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ship-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="thruster-glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="kokoci-visor" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="640" height="240" fill="url(#galaxy1-sky)"/>

  <!-- Swirling Nebula Cloud -->
  <rect x="0" y="0" width="640" height="240" fill="url(#nebula-glow)"/>

  <!-- Background Celestial Starfield -->
  <circle cx="50" cy="40" r="1.5" fill="#f8fafc" opacity="0.8"/>
  <circle cx="120" cy="85" r="1.2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="180" cy="30" r="2" fill="#fde047" opacity="0.6"/>
  <circle cx="230" cy="70" r="1.2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="310" cy="25" r="1.8" fill="#f8fafc" opacity="0.75"/>
  <circle cx="360" cy="90" r="1" fill="#38bdf8" opacity="0.6"/>
  <circle cx="440" cy="45" r="1.5" fill="#f8fafc" opacity="0.5"/>
  <circle cx="520" cy="20" r="2.2" fill="#e879f9" opacity="0.7"/>
  <circle cx="590" cy="60" r="1.4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="610" cy="110" r="1.2" fill="#f8fafc" opacity="0.6"/>

  <!-- Distant Cosmic Planet (Planet Gurunda / Volcania in background) -->
  <g transform="translate(480, 25)">
    <circle cx="50" cy="50" r="42" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <ellipse cx="50" cy="50" rx="68" ry="14" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" transform="rotate(-18 50 50)"/>
    <circle cx="35" cy="40" r="30" fill="#312e81" opacity="0.4"/>
  </g>

  <!-- TAPOPS Spaceship Cruiser (Left & Center-Left) -->
  <g transform="translate(50, 45)">
    <!-- Thruster Exhaust Trail -->
    <polygon points="-25,78 12,70 12,86" fill="url(#thruster-glow)" filter="url(#glow-cyan)"/>
    <polygon points="-40,78 0,65 0,91" fill="url(#thruster-glow)" opacity="0.5"/>
    <line x1="-60" y1="78" x2="10" y2="78" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Starship Wings and Stabilizers -->
    <!-- Lower wing -->
    <polygon points="30,85 100,125 150,110 90,82" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <polygon points="50,92 105,120 125,112 80,90" fill="#0f172a"/>
    <!-- Upper wing -->
    <polygon points="30,71 100,31 150,46 90,74" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
    <polygon points="50,64 105,36 125,44 80,66" fill="#1e293b"/>
    <!-- Main Fuselage -->
    <path d="M15 78 L60 62 L150 60 L210 75 L225 78 L210 81 L150 96 L60 94 Z" fill="url(#ship-hull)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Command Bridge Window Strip -->
    <polygon points="140,70 185,73 185,79 140,76" fill="#38bdf8" filter="url(#glow-cyan)"/>
    <line x1="145" y1="74" x2="180" y2="75" stroke="#ffffff" stroke-width="1"/>
    <!-- Yellow TAPOPS Accent Stripe -->
    <polygon points="80,73 130,73 125,78 75,78" fill="#eab308"/>
    <!-- Forward Sensor Array & Deflector Nose -->
    <polygon points="215,75 240,78 215,81" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Commander Koko Ci & TAPOPS Hologram Seal (Right Center) -->
  <g transform="translate(390, 30)">
    <!-- Holographic Hexagonal Grid Seal -->
    <polygon points="80,10 135,42 135,106 80,138 25,106 25,42" fill="#0284c7" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Inner Rings -->
    <circle cx="80" cy="74" r="50" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
    
    <!-- Commander Koko Ci Silhouette & Iconic Cap/Glasses -->
    <!-- Head Base -->
    <circle cx="80" cy="70" r="28" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <!-- Large Visor / Sunglasses -->
    <path d="M58 66 Q80 72 102 66 Q100 82 80 84 Q60 82 58 66 Z" fill="url(#kokoci-visor)" stroke="#022c22" stroke-width="1.5"/>
    <ellipse cx="70" cy="73" rx="5" ry="3" fill="#6ee7b7" opacity="0.8"/>
    <ellipse cx="90" cy="73" rx="5" ry="3" fill="#6ee7b7" opacity="0.8"/>
    <!-- Commander Peak Cap -->
    <path d="M54 55 Q80 44 106 55 L112 50 Q80 32 48 50 Z" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <path d="M58 48 Q80 38 102 48 L100 42 Q80 30 60 42 Z" fill="#1e293b"/>
    <!-- Gold Commander Star Badge on Cap -->
    <polygon points="80,38 82,43 87,43 83,46 85,51 80,48 75,51 77,46 73,43 78,43" fill="#fbbf24" filter="url(#glow-gold)"/>
    <!-- Uniform Collar & Epaulets -->
    <path d="M58 96 L80 87 L102 96 L115 125 L45 125 Z" fill="#064e3b" stroke="#047857" stroke-width="1"/>
    <polygon points="80,88 74,102 86,102" fill="#fbbf24"/>
  </g>

  <!-- Power Sphera Tracking Orbs (Cadet Search Mission) -->
  <g transform="translate(290, 48)">
    <!-- Motobot / BellBot / CardBot Spherical Ping -->
    <circle cx="30" cy="25" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="26" cy="23" r="3.5" fill="#38bdf8"/>
    <circle cx="34" cy="23" r="3.5" fill="#38bdf8"/>
    <circle cx="30" cy="25" r="22" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Data Connection Beams -->
    <line x1="45" y1="30" x2="90" y2="55" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7"/>
    <circle cx="95" cy="58" r="9" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="95" cy="58" r="3" fill="#f43f5e"/>
  </g>

  <!-- Foreground Vignette Gradient Overlay -->
  <rect x="0" y="180" width="640" height="60" fill="url(#galaxy1-sky)" opacity="0.95"/>

  <!-- Typography & Era Tagging -->
  <g transform="translate(30, 218)">
    <rect x="-10" y="-18" width="135" height="22" rx="4" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1"/>
    <text x="57" y="-3" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">GALACTIC ERA</text>
  </g>
  <text x="170" y="215" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">
    BoBoiBoy Galaxy S1 <tspan fill="#94a3b8" font-size="12" font-weight="500">(2016–2018)</tspan>
  </text>
  <text x="615" y="216" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="1">
    TAPOPS SPACE ODYSSEY • 24 EPS
  </text>
</svg>
