<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="movie2-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180424"/>
      <stop offset="45%" stop-color="#2a0845"/>
      <stop offset="80%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="quabaq-crags" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crystal-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="retakka-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="frostfire-vortex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow-frostfire" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-retakka" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e11d48" flood-opacity="0.85"/>
    </filter>
    <filter id="crystal-flare" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Sky Canvas: Volatile Atmospheric Deep Quabaq -->
  <rect width="640" height="240" fill="url(#movie2-sky)"/>

  <!-- Distant Cosmic Shards & Storm Flares -->
  <circle cx="95" cy="35" r="1.5" fill="#fbcfe8" opacity="0.6"/>
  <circle cx="210" cy="50" r="1.2" fill="#fed7aa" opacity="0.5"/>
  <circle cx="340" cy="20" r="1.8" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="480" cy="45" r="1.5" fill="#fbcfe8" opacity="0.6"/>
  <circle cx="590" cy="30" r="1.2" fill="#fed7aa" opacity="0.5"/>

  <!-- Planet Quabaq Ancient Crags & Giant Bioluminescent Trees (Left) -->
  <g transform="translate(10, 30)">
    <!-- Deep mountain peaks in background -->
    <polygon points="-10,165 70,80 145,170" fill="#1e1b4b" opacity="0.7"/>
    <polygon points="100,170 175,70 250,170" fill="#311042" opacity="0.6"/>
    <!-- Rocky Cliff Fore-range -->
    <path d="M-10 180 Q80 130 180 155 Q240 140 280 175 L280 220 L-10 220 Z" fill="url(#quabaq-crags)"/>
    <!-- Giant Glowing Energy Crystals of Quabaq -->
    <!-- Crystal cluster 1 -->
    <polygon points="45,145 55,95 65,100 68,145" fill="url(#crystal-glow)" filter="url(#crystal-flare)"/>
    <polygon points="65,145 75,108 85,116 80,145" fill="url(#crystal-glow)" opacity="0.9"/>
    <polygon points="30,150 40,118 48,125 42,150" fill="url(#crystal-glow)" opacity="0.75"/>
    <!-- Crystal cluster 2 -->
    <polygon points="190,148 202,105 212,112 208,148" fill="url(#crystal-glow)" filter="url(#crystal-flare)"/>
    <polygon points="208,148 218,120 228,126 220,148" fill="url(#crystal-glow)" opacity="0.8"/>
  </g>

  <!-- Retak'ka The Ancient Cosmic Tyrant Silhouette (Center-Right) -->
  <g transform="translate(420, 25)" filter="url(#glow-retakka)">
    <!-- Ominous Dark Elemental Aura -->
    <path d="M-20 130 Q-10 60 40 40 Q75 15 110 40 Q160 60 170 130 Q120 150 75 140 Q10 150 -20 130 Z" fill="url(#retakka-dark)" opacity="0.45"/>
    <!-- Jagged Spiky Pauldrons / Armor Mantle -->
    <polygon points="15,65 35,40 55,60 75,32 95,60 115,40 135,65 125,120 25,120" fill="#0f0728" stroke="#be123c" stroke-width="1.5"/>
    <!-- Retak'ka Glowing Horned Mask / Crown -->
    <polygon points="40,45 25,10 50,30 75,5 100,30 125,10 110,45" fill="#881337" stroke="#e11d48" stroke-width="1.2"/>
    <!-- Sinister Glowing Crimson Eyes -->
    <polygon points="56,48 70,51 68,55 54,52" fill="#fbbf24"/>
    <circle cx="62" cy="51" r="2" fill="#ef4444"/>
    <polygon points="94,48 80,51 82,55 96,52" fill="#fbbf24"/>
    <circle cx="88" cy="51" r="2" fill="#ef4444"/>
    <!-- Retak'ka Elemental Siphon Core (Chest Prism) -->
    <polygon points="75,70 90,85 75,102 60,85" fill="#e11d48" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="75" cy="85" r="4" fill="#ffffff"/>
    <!-- Dark Lightning Tendrils radiating outwards -->
    <path d="M30 65 L10 50 L20 40 L-5 25" stroke="#f43f5e" stroke-width="1.8" fill="none" opacity="0.8"/>
    <path d="M120 65 L145 50 L135 40 L160 25" stroke="#be123c" stroke-width="1.8" fill="none" opacity="0.8"/>
  </g>

  <!-- BoBoiBoy FrostFire / Glacier Elemental Clash Vortex (Center) -->
  <g transform="translate(260, 45)" filter="url(#glow-frostfire)">
    <!-- Swirling Dual Elemental Blast (Fire & Ice Fusion) -->
    <!-- Fire Arc -->
    <path d="M45 25 Q90 0 100 45 Q70 65 40 55 Q20 45 45 25 Z" fill="#f97316" opacity="0.9"/>
    <!-- Ice Crystal Arc -->
    <path d="M45 85 Q90 110 100 65 Q70 45 40 55 Q20 65 45 85 Z" fill="#06b6d4" opacity="0.9"/>
    <!-- White-Hot Fusion Collision Core -->
    <circle cx="55" cy="55" r="16" fill="#ffffff"/>
    <circle cx="55" cy="55" r="24" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
    
    <!-- Glacial Crystal Spikes -->
    <polygon points="45,55 30,25 50,38" fill="#e0f2fe"/>
    <polygon points="55,55 75,20 65,40" fill="#38bdf8"/>
    <!-- Solar/Fire Sparks -->
    <polygon points="45,55 25,80 48,70" fill="#ef4444"/>
    <polygon points="55,55 78,85 64,68" fill="#f59e0b"/>
  </g>

  <!-- Upgraded Power Sphera Ochobot / Siphon Protection Beacon (Left-Center) -->
  <g transform="translate(195, 105)">
    <circle cx="20" cy="20" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="16" cy="18" r="3.5" fill="#38bdf8"/>
    <circle cx="24" cy="18" r="3.5" fill="#38bdf8"/>
    <ellipse cx="20" cy="26" rx="5" ry="1.5" fill="#38bdf8"/>
    <line x1="20" y1="6" x2="20" y2="1" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="20" cy="0" r="2" fill="#f59e0b"/>
  </g>

  <!-- Foreground Vignette Gradient Overlay -->
  <rect x="0" y="180" width="640" height="60" fill="url(#movie2-sky)" opacity="0.95"/>

  <!-- Typography & Era Tagging -->
  <g transform="translate(30, 218)">
    <rect x="-10" y="-18" width="135" height="22" rx="4" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1"/>
    <text x="57" y="-3" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#fb7185" text-anchor="middle" letter-spacing="1.5">FEATURE FILM 2</text>
  </g>
  <text x="170" y="215" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">
    BoBoiBoy Movie 2 <tspan fill="#94a3b8" font-size="12" font-weight="500">(2019)</tspan>
  </text>
  <text x="615" y="216" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#f43f5e" text-anchor="end" letter-spacing="1">
    WRATH OF RETAK'KA • 117 MINS
  </text>
</svg>
