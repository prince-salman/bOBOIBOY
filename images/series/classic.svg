<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="classic-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="sun-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hill-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="hill-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="stall-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="60%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <filter id="glow-classic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ff5722" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="640" height="240" fill="url(#classic-sky)"/>

  <!-- Warm Morning Sun / Sunrise Glow -->
  <circle cx="500" cy="110" r="95" fill="url(#sun-glow)" filter="blur(20px)"/>
  <circle cx="500" cy="110" r="45" fill="#fde68a" opacity="0.4"/>

  <!-- Distant Stars & Clouds -->
  <circle cx="90" cy="40" r="1.5" fill="#f8fafc" opacity="0.6"/>
  <circle cx="160" cy="65" r="1.2" fill="#f8fafc" opacity="0.4"/>
  <circle cx="280" cy="35" r="1.5" fill="#f8fafc" opacity="0.5"/>
  <circle cx="390" cy="50" r="1" fill="#f8fafc" opacity="0.4"/>

  <!-- Cloud Silhouettes -->
  <path d="M40 90 Q65 70 95 85 Q130 65 165 85 Q190 75 210 95 Z" fill="#334155" opacity="0.3"/>
  <path d="M420 70 Q450 50 490 65 Q530 45 570 65 Q595 55 620 75 Z" fill="#475569" opacity="0.25"/>

  <!-- Pulau Rintis Rolling Hills -->
  <path d="M-20 200 Q140 120 310 165 T660 150 L660 240 L-20 240 Z" fill="url(#hill-back)"/>
  <path d="M-20 215 Q160 160 380 185 T660 170 L660 240 L-20 240 Z" fill="url(#hill-front)"/>

  <!-- Tok Aba Kokotiam Stall Silhouette (Left-Center) -->
  <g transform="translate(45, 120)">
    <!-- Stall Base and Counter -->
    <rect x="20" y="45" width="110" height="45" rx="3" fill="#1e1b18" stroke="#78350f" stroke-width="1.5"/>
    <!-- Stall Posts -->
    <rect x="25" y="15" width="5" height="35" fill="#92400e"/>
    <rect x="120" y="15" width="5" height="35" fill="#92400e"/>
    <!-- Canopy Roof -->
    <polygon points="15,18 135,18 142,5 8,5" fill="url(#stall-roof)"/>
    <!-- Signboard: TOK ABA'S KOKO -->
    <rect x="35" y="24" width="80" height="16" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="35" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="8" fill="#fef08a" text-anchor="middle" letter-spacing="1">TOK ABA KOKO</text>
    <!-- Steaming Hot Chocolate Mug -->
    <rect x="75" y="47" width="14" height="14" rx="2" fill="#dc2626"/>
    <path d="M89 50 C92 50 93 56 89 57" stroke="#dc2626" stroke-width="2" fill="none"/>
    <!-- Steam -->
    <path d="M78 44 Q80 39 82 44" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M84 43 Q86 38 88 43" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Cocoa Pod & Beans (Floating Heritage) -->
  <g transform="translate(195, 135)">
    <!-- Cocoa Pod -->
    <ellipse cx="25" cy="30" rx="18" ry="11" transform="rotate(-25 25 30)" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
    <path d="M12 25 Q25 22 38 35" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Cocoa Beans -->
    <ellipse cx="50" cy="42" rx="7" ry="4.5" transform="rotate(30 50 42)" fill="#92400e" stroke="#d97706" stroke-width="1"/>
    <ellipse cx="62" cy="35" rx="6" ry="4" transform="rotate(-15 62 35)" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Central Highlight: BoBoiBoy's Classic Cap with Lightning Bolt -->
  <g transform="translate(340, 60)" filter="url(#glow-classic)">
    <!-- Cap Dome -->
    <path d="M15 45 C15 15 45 4 80 4 C115 4 145 15 145 45 C145 52 135 55 125 55 C105 55 95 50 80 50 C65 50 55 55 35 55 C25 55 15 52 15 45 Z" fill="url(#cap-grad)" stroke="#d84315" stroke-width="2"/>
    <!-- Visor Flap turned backward -->
    <path d="M35 15 C45 5 115 5 125 15 C115 11 45 11 35 15 Z" fill="#bf360c"/>
    <!-- Cap Lightning Crest Badge -->
    <circle cx="80" cy="32" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M82 19 L72 32 L79 32 L76 43 L88 29 L81 29 Z" fill="#fef08a" stroke="#f59e0b" stroke-width="0.8" filter="url(#glow-yellow)"/>
  </g>

  <!-- 3 Primal Elemental Sparks (Kuasa Tiga Split Representation) -->
  <!-- Lightning Spark -->
  <g transform="translate(480, 50)" filter="url(#glow-yellow)">
    <circle cx="22" cy="22" r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M23 11 L16 23 L21 23 L18 31 L28 20 L23 20 Z" fill="#fbbf24"/>
    <text x="22" y="47" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="8" fill="#fbbf24" text-anchor="middle">PETIR</text>
  </g>

  <!-- Wind Spark -->
  <g transform="translate(540, 75)">
    <circle cx="22" cy="22" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M12 20 Q20 12 28 17 T22 27 T15 22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="47" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="8" fill="#38bdf8" text-anchor="middle">ANGIN</text>
  </g>

  <!-- Earth Spark -->
  <g transform="translate(590, 115)">
    <circle cx="20" cy="20" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="12,18 20,10 28,14 27,27 15,28" fill="#d97706" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="43" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="7.5" fill="#f59e0b" text-anchor="middle">TANAH</text>
  </g>

  <!-- Foreground Vignette Gradient Overlay -->
  <rect x="0" y="180" width="640" height="60" fill="url(#hill-front)" opacity="0.9"/>

  <!-- Typography & Era Tagging -->
  <g transform="translate(30, 218)">
    <rect x="-10" y="-18" width="125" height="22" rx="4" fill="#ff5722" fill-opacity="0.2" stroke="#ff5722" stroke-width="1"/>
    <text x="52" y="-3" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#ff7043" text-anchor="middle" letter-spacing="1.5">CLASSIC ERA</text>
  </g>
  <text x="160" y="215" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">
    BoBoiBoy Classic <tspan fill="#94a3b8" font-size="12" font-weight="500">(2011–2016)</tspan>
  </text>
  <text x="615" y="216" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="1">
    SEASONS 1–3 • 52 EPS
  </text>
</svg>
