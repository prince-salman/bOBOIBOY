<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="fang-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="fang-jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="fang-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#fang-bg)" stroke="#8b5cf6" stroke-width="2.5" filter="url(#fang-glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Spiky Dark Purple-Black Hair -->
  <!-- Top & Side Hair Spikes -->
  <path d="M22 46 L20 32 L30 36 L32 24 L42 30 L50 16 L58 30 L68 24 L70 36 L80 32 L78 46 L80 60 L74 66 L26 66 L20 60 Z" fill="#18181b" />
  <path d="M36 28 L44 19 L48 26 Z" fill="#27272a" />
  <path d="M52 26 L56 19 L64 28 Z" fill="#27272a" />

  <!-- Face -->
  <ellipse cx="50" cy="52" rx="19" ry="18" fill="#fcd34d" opacity="0.9" />

  <!-- Forehead Bangs Spikes -->
  <polygon points="32,38 38,48 40,38" fill="#18181b" />
  <polygon points="44,38 50,47 52,38" fill="#18181b" />
  <polygon points="60,38 62,48 68,38" fill="#18181b" />

  <!-- Iconic Red Combat Glasses / Goggles -->
  <path d="M33 46 C33 44 47 44 47 46 L47 54 C47 56 33 56 33 54 Z" fill="rgba(239, 68, 68, 0.45)" stroke="#dc2626" stroke-width="1.8" />
  <path d="M53 46 C53 44 67 44 67 46 L67 54 C67 56 53 56 53 54 Z" fill="rgba(239, 68, 68, 0.45)" stroke="#dc2626" stroke-width="1.8" />
  <!-- Bridge & Temples -->
  <line x1="47" y1="50" x2="53" y2="50" stroke="#dc2626" stroke-width="2" />
  <line x1="26" y1="48" x2="33" y2="48" stroke="#dc2626" stroke-width="1.5" />
  <line x1="67" y1="48" x2="74" y2="48" stroke="#dc2626" stroke-width="1.5" />

  <!-- Sharp Eyes Through Glasses -->
  <ellipse cx="40" cy="50" rx="3" ry="2.5" fill="#0f172a" />
  <circle cx="41" cy="49" r="0.9" fill="#ffffff" />
  <ellipse cx="60" cy="50" rx="3" ry="2.5" fill="#0f172a" />
  <circle cx="61" cy="49" r="0.9" fill="#ffffff" />

  <!-- Confident Hero Smirk -->
  <path d="M48 61 Q53 64 57 60" stroke="#6b21a8" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- High-Collar Tactical Jacket -->
  <path d="M26 78 C32 68 40 67 50 67 C60 67 68 68 74 78 L74 88 L26 88 Z" fill="url(#fang-jacket)" stroke="#4338ca" stroke-width="1.2" />
  <path d="M34 68 L38 78 L46 68" fill="#312e81" stroke="#6366f1" stroke-width="1" />
  <path d="M66 68 L62 78 L54 68" fill="#312e81" stroke="#6366f1" stroke-width="1" />
</svg>
