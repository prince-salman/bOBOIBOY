<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="ying-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="ying-beanie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="ying-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#ying-bg)" stroke="#06b6d4" stroke-width="2.5" filter="url(#ying-glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Hair Back (Dark Blue-Black Braids) -->
  <path d="M25 45 C25 28 35 18 50 18 C65 18 75 28 75 45 C75 58 72 68 70 76 L30 76 C28 68 25 58 25 45 Z" fill="#172554" />
  <!-- Side Braids / Bangs -->
  <path d="M26 50 C24 62 26 74 28 80 C30 80 32 72 32 60 Z" fill="#172554" />
  <path d="M74 50 C76 62 74 74 72 80 C70 80 68 72 68 60 Z" fill="#172554" />

  <!-- Face -->
  <ellipse cx="50" cy="50" rx="18" ry="17" fill="#fcd34d" opacity="0.9" />

  <!-- Turquoise Beanie Cap -->
  <path d="M26 38 C26 22 36 15 50 15 C64 15 74 22 74 38 C74 41 68 42 50 42 C32 42 26 41 26 38 Z" fill="url(#ying-beanie)" stroke="#0891b2" stroke-width="1.5" />
  <!-- Beanie Yellow Brim / Band -->
  <path d="M28 39 C34 37 66 37 72 39 C72 43 66 45 50 45 C34 45 28 43 28 39 Z" fill="#facc15" />
  <!-- Beanie Pom Pom -->
  <circle cx="50" cy="13" r="5" fill="#facc15" stroke="#eab308" stroke-width="1" />

  <!-- Round Glasses (Frames) -->
  <circle cx="42" cy="50" r="7" fill="rgba(224, 242, 254, 0.4)" stroke="#0891b2" stroke-width="1.8" />
  <circle cx="58" cy="50" r="7" fill="rgba(224, 242, 254, 0.4)" stroke="#0891b2" stroke-width="1.8" />
  <!-- Glasses Bridge -->
  <path d="M49 50 L51 50" stroke="#0891b2" stroke-width="2" />

  <!-- Lively Eyes Inside Lenses -->
  <ellipse cx="42" cy="50" rx="3" ry="3.5" fill="#0f172a" />
  <circle cx="43" cy="49" r="1.1" fill="#ffffff" />
  <ellipse cx="58" cy="50" rx="3" ry="3.5" fill="#0f172a" />
  <circle cx="59" cy="49" r="1.1" fill="#ffffff" />

  <!-- Sprightly Smile -->
  <path d="M45 60 Q50 64 55 60" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Hero Collar (Turquoise & Yellow) -->
  <path d="M30 76 C35 70 42 69 50 69 C58 69 65 70 70 76 L70 88 L30 88 Z" fill="#0891b2" />
  <path d="M44 69 L50 78 L56 69" fill="#facc15" />
</svg>
