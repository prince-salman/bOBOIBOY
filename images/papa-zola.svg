<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="papa-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="papa-cape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="papa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#papa-bg)" stroke="#ef4444" stroke-width="2.5" filter="url(#papa-glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#facc15" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Slick Back Hero Hair -->
  <path d="M26 42 C26 22 36 15 50 15 C64 15 74 22 74 42 C74 54 72 62 70 66 L30 66 C28 62 26 54 26 42 Z" fill="#1c1917" />
  <!-- Hair Pompadour Arc -->
  <path d="M36 20 C42 12 58 12 64 20 C58 16 42 16 36 20 Z" fill="#292524" />

  <!-- Face -->
  <ellipse cx="50" cy="52" rx="20" ry="19" fill="#fcd34d" opacity="0.9" />

  <!-- Iconic Teal Domino Hero Mask -->
  <path d="M28 47 C32 40 44 40 48 45 C49 46 51 46 52 45 C56 40 68 40 72 47 C74 52 69 57 60 55 C54 53 52 50 50 50 C48 50 46 53 40 55 C31 57 26 52 28 47 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="1.5" />

  <!-- Determined Eyes Inside Mask Holes -->
  <ellipse cx="40" cy="48" rx="3.5" ry="3.5" fill="#ffffff" />
  <ellipse cx="40" cy="48" rx="2" ry="2" fill="#0f172a" />
  <circle cx="41" cy="47" r="0.8" fill="#ffffff" />

  <ellipse cx="60" cy="48" rx="3.5" ry="3.5" fill="#ffffff" />
  <ellipse cx="60" cy="48" rx="2" ry="2" fill="#0f172a" />
  <circle cx="61" cy="47" r="0.8" fill="#ffffff" />

  <!-- Flamboyant Superhero Mustache -->
  <path d="M50 58 C46 54 36 54 34 61 C38 62 46 60 50 62 C54 60 62 62 66 61 C64 54 54 54 50 58 Z" fill="#1c1917" />

  <!-- Dramatic Hero Smile / Shout -->
  <path d="M44 63 Q50 69 56 63" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Hero Costume & Cape Collar -->
  <path d="M26 78 C32 68 40 67 50 67 C60 67 68 68 74 78 L74 88 L26 88 Z" fill="url(#papa-cape)" stroke="#b91c1c" stroke-width="1.5" />
  <!-- Golden Emblem / Star on Collar -->
  <path d="M42 67 L50 78 L58 67" fill="#facc15" stroke="#eab308" stroke-width="1" />
  <!-- Small Star of Justice -->
  <polygon points="50,71 51.5,74 54.5,74 52,76 53,79 50,77.5 47,79 48,76 45.5,74 48.5,74" fill="#ef4444" />
</svg>
