<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="ocho-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <radialGradient id="ocho-sphere" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <radialGradient id="ocho-eye" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="ocho-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#ocho-bg)" stroke="#38bdf8" stroke-width="2.5" filter="url(#ocho-glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#facc15" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Left & Right Ear Pods -->
  <circle cx="21" cy="50" r="9" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="21" cy="50" r="5" fill="#ff7043" />
  <circle cx="79" cy="50" r="9" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" />
  <circle cx="79" cy="50" r="5" fill="#ff7043" />

  <!-- Main Spherical Body -->
  <circle cx="50" cy="50" r="30" fill="url(#ocho-sphere)" stroke="#a16207" stroke-width="1.5" />

  <!-- Visor Dark Band -->
  <rect x="25" y="40" width="50" height="18" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

  <!-- Cyan Glowing Eyes -->
  <ellipse cx="40" cy="49" rx="6.5" ry="5" fill="url(#ocho-eye)" />
  <circle cx="41" cy="47" r="1.8" fill="#ffffff" />
  <ellipse cx="60" cy="49" rx="6.5" ry="5" fill="url(#ocho-eye)" />
  <circle cx="61" cy="47" r="1.8" fill="#ffffff" />

  <!-- Top Head Antenna Fin / Crest -->
  <path d="M46 20 L54 20 L52 24 L48 24 Z" fill="#ff5722" />
  <circle cx="50" cy="18" r="3" fill="#38bdf8" />

  <!-- Power Core Indicator (Chest) -->
  <circle cx="50" cy="69" r="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <circle cx="50" cy="69" r="2" fill="#e0f2fe" />

  <!-- Spherical Panel Seam Lines -->
  <path d="M28 32 C38 28 62 28 72 32" stroke="#a16207" stroke-width="1" opacity="0.5" fill="none" />
  <path d="M30 68 C40 73 60 73 70 68" stroke="#a16207" stroke-width="1" opacity="0.5" fill="none" />
</svg>
