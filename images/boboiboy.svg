<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="bbb-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="bbb-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="60%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="bbb-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="bbb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff5722" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bbb-bg)" stroke="#ff5722" stroke-width="2.5" filter="url(#bbb-glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Character Avatar Illustration -->
  <!-- Dark Hair Back -->
  <path d="M26 44 C26 30 36 20 50 20 C64 20 74 30 74 44 C74 54 68 62 64 66 L36 66 C32 62 26 54 26 44 Z" fill="#1e1b18" />

  <!-- Face -->
  <ellipse cx="50" cy="52" rx="20" ry="19" fill="#fcd34d" opacity="0.9" />

  <!-- Signature Orange Backward Cap -->
  <path d="M25 40 C25 24 36 16 50 16 C64 16 75 24 75 40 C75 42 72 44 68 44 C60 44 56 42 50 42 C44 42 40 44 32 44 C28 44 25 42 25 40 Z" fill="url(#bbb-cap)" stroke="#d84315" stroke-width="1.5" />
  <!-- Backward Visor Flap -->
  <path d="M34 19 C38 12 62 12 66 19 C61 17 39 17 34 19 Z" fill="#bf360c" />

  <!-- Cap Emblem: Lightning Crest -->
  <path d="M51 23 L46 32 L50 32 L48 38 L55 29 L51 29 Z" fill="url(#bbb-bolt)" stroke="#ffffff" stroke-width="0.5" />

  <!-- Hair Tuft Forehead -->
  <path d="M32 41 L38 46 L36 41 Z" fill="#292524" />
  <path d="M68 41 L62 46 L64 41 Z" fill="#292524" />

  <!-- Confident Eyes -->
  <ellipse cx="42" cy="52" rx="3.5" ry="4" fill="#0f172a" />
  <circle cx="43" cy="51" r="1.2" fill="#ffffff" />
  <ellipse cx="58" cy="52" rx="3.5" ry="4" fill="#0f172a" />
  <circle cx="59" cy="51" r="1.2" fill="#ffffff" />

  <!-- Cheerful / Hero Smile -->
  <path d="M44 61 Q50 67 56 61" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Hero Collar / Jacket -->
  <path d="M28 78 C32 68 40 67 50 67 C60 67 68 68 72 78 L72 88 L28 88 Z" fill="#ff5722" />
  <path d="M42 67 L50 78 L58 67" fill="#1e293b" stroke="#ff7043" stroke-width="1.5" />
</svg>
