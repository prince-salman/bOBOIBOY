<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="logo-grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="50%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="logo-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="logo-shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff5722" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem: Shield & Elemental Star -->
  <g transform="translate(6, 4)">
    <!-- Hexagonal / Shield Base -->
    <polygon points="26,2 48,12 48,38 26,50 4,38 4,12" fill="url(#logo-shield-bg)" stroke="#ff5722" stroke-width="2.5" filter="url(#glow-orange)"/>
    <!-- Inner Accent Ring -->
    <polygon points="26,7 43,15 43,35 26,45 9,35 9,15" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    
    <!-- Central Lightning / Elemental Star Crest -->
    <path d="M28 10 L16 28 L25 28 L22 42 L36 24 L27 24 Z" fill="url(#logo-grad-gold)" />
    <!-- Mini Energy Spark dots -->
    <circle cx="12" cy="18" r="1.5" fill="#38bdf8" />
    <circle cx="40" cy="18" r="1.5" fill="#38bdf8" />
    <circle cx="26" cy="46" r="1.5" fill="#ff7043" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: BOBOIBOY -->
  <text x="68" y="32" font-family="'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="#0f172a">
    BOBOI<tspan fill="url(#logo-grad-orange)">BOY</tspan>
  </text>
  
  <!-- Subtitle Tag: GALAXY • TAPOPS CADET -->
  <text x="70" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#38bdf8">
    TAPOPS GALAXY
  </text>
  
  <!-- Subtle cosmic star accent -->
  <polygon points="220,16 222,21 227,22 222,24 220,29 218,24 213,22 218,21" fill="#fde047" opacity="0.8"/>
  <polygon points="255,30 256,33 259,34 256,35 255,38 254,35 251,34 254,33" fill="#38bdf8" opacity="0.6"/>
</svg>
