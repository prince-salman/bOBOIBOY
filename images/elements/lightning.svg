<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="lightning-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="lightning-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow-lightning" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#lightning-bg)" stroke="#fbbf24" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Lightning Bolt Icon -->
  <path d="M54 16 L28 48 L46 48 L40 84 L72 44 L52 44 Z" 
        fill="url(#lightning-bolt)" 
        stroke="#fff" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#glow-lightning)"/>

  <!-- Energy sparks -->
  <circle cx="28" cy="28" r="2" fill="#fef08a" opacity="0.8" />
  <circle cx="74" cy="68" r="2" fill="#fbbf24" opacity="0.8" />
  <circle cx="68" cy="30" r="1.5" fill="#fef08a" opacity="0.7" />
  <circle cx="26" cy="66" r="1.5" fill="#fbbf24" opacity="0.7" />
</svg>
