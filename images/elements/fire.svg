<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="fire-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#fire-bg)" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Blazing Flame Icon -->
  <g filter="url(#glow-fire)">
    <!-- Outer Flame -->
    <path d="M50 18 C52 28 62 34 66 42 C72 52 70 66 62 74 C54 82 42 82 34 74 C26 66 26 52 34 40 C38 48 44 50 44 42 C44 32 48 24 50 18 Z" 
          fill="url(#flame-outer)" />
    <!-- Secondary Left Tongue -->
    <path d="M38 52 C32 58 34 68 40 72 C34 68 34 60 38 52 Z" fill="#b91c1c" opacity="0.5" />
    <!-- Inner Core Flame -->
    <path d="M50 44 C53 50 58 54 58 60 C58 67 53 72 48 72 C43 72 40 67 42 62 C43 57 47 52 50 44 Z" 
          fill="url(#flame-inner)" />
  </g>

  <!-- Ember sparks -->
  <circle cx="26" cy="34" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="72" cy="30" r="2" fill="#f97316" opacity="0.8" />
  <circle cx="68" cy="68" r="1.5" fill="#fde047" opacity="0.7" />
  <circle cx="30" cy="70" r="1.5" fill="#ef4444" opacity="0.7" />
</svg>
