<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="leaf-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="thorn-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow-leaf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#leaf-bg)" stroke="#10b981" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Botanical Leaf & Thorn Motif -->
  <g filter="url(#glow-leaf)">
    <!-- Primary Razor Leaf (Diagonal Tilt) -->
    <path d="M28 72 C28 50 42 24 74 18 C72 48 56 74 28 72 Z" 
          fill="url(#leaf-grad)" stroke="#a7f3d0" stroke-width="1.5"/>
    
    <!-- Leaf Center Stem / Vein -->
    <path d="M28 72 C42 58 54 44 74 18" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf Side Veins -->
    <path d="M42 58 Q48 50 56 50" stroke="#ecfdf5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M52 46 Q60 38 66 38" stroke="#ecfdf5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Thorn / Small Secondary Leaf Vine -->
    <path d="M38 68 C30 64 26 52 34 46 C34 56 36 62 38 68 Z" fill="url(#thorn-grad)"/>
    <path d="M56 32 C62 30 68 32 66 26 C62 28 58 30 56 32 Z" fill="#a7f3d0"/>
  </g>

  <!-- Flora / Nature Spores -->
  <circle cx="72" cy="52" r="2" fill="#a7f3d0" opacity="0.8" />
  <circle cx="26" cy="38" r="2" fill="#34d399" opacity="0.8" />
  <circle cx="64" cy="74" r="1.5" fill="#a7f3d0" opacity="0.7" />
  <circle cx="38" cy="24" r="1.5" fill="#34d399" opacity="0.7" />
</svg>
