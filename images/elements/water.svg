<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="water-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow-water" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#water-bg)" stroke="#06b6d4" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#a5f3fc" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Water Droplet & Wave Motif -->
  <g filter="url(#glow-water)">
    <!-- Main Teardrop -->
    <path d="M50 18 C50 18 30 46 30 62 C30 73 39 82 50 82 C61 82 70 73 70 62 C70 46 50 18 50 18 Z" 
          fill="url(#drop-grad)" stroke="#a5f3fc" stroke-width="1.5" />
    
    <!-- Droplet Glint / Reflection -->
    <path d="M42 46 C40 52 40 60 44 66 C42 64 41 58 43 50 C44 46 47 43 47 43 C47 43 43 44 42 46 Z" 
          fill="#ffffff" opacity="0.8" />
    
    <!-- Wave Splash Curve across bottom -->
    <path d="M34 66 C40 62 46 72 52 64 C58 58 64 64 66 66" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Water droplets around -->
  <circle cx="26" cy="34" r="2" fill="#a5f3fc" opacity="0.8" />
  <circle cx="74" cy="36" r="2.5" fill="#22d3ee" opacity="0.8" />
  <circle cx="70" cy="72" r="1.5" fill="#a5f3fc" opacity="0.7" />
  <circle cx="28" cy="74" r="1.5" fill="#22d3ee" opacity="0.7" />
</svg>
