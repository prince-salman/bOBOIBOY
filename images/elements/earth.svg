<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="earth-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="rock-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="rock-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="glow-earth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d97706" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#earth-bg)" stroke="#d97706" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Mountain / Faceted Earth Boulder Shield -->
  <g filter="url(#glow-earth)">
    <!-- Central mountain / boulder facet -->
    <polygon points="50,18 24,62 50,78 76,62" fill="url(#rock-grad-1)" stroke="#fcd34d" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left shaded facet -->
    <polygon points="50,18 24,62 50,56" fill="url(#rock-grad-2)" opacity="0.85"/>
    <!-- Inner seismic core fissure lines -->
    <polyline points="50,24 50,56 34,60" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/>
    <polyline points="50,56 64,62" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/>
    <polygon points="50,56 38,72 50,78 62,72" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Ground rumble pebbles -->
  <circle cx="22" cy="40" r="2.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="78" cy="42" r="2.5" fill="#fcd34d" opacity="0.8" />
  <circle cx="32" cy="74" r="2" fill="#d97706" opacity="0.8" />
  <circle cx="68" cy="74" r="2" fill="#d97706" opacity="0.8" />
</svg>
