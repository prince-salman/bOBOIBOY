<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="light-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="sun-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>
    <linearGradient id="ray-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#facc15" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Shield Container -->
  <circle cx="50" cy="50" r="46" fill="url(#light-bg)" stroke="#facc15" stroke-width="2.5" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" />

  <!-- Solar Burst & Radiant Core -->
  <g filter="url(#glow-light)">
    <!-- 8 Major Solar Diamond Rays -->
    <!-- North / South / East / West -->
    <polygon points="50,14 54,34 50,38 46,34" fill="url(#ray-grad)" />
    <polygon points="50,86 54,66 50,62 46,66" fill="url(#ray-grad)" />
    <polygon points="14,50 34,46 38,50 34,54" fill="url(#ray-grad)" />
    <polygon points="86,50 66,46 62,50 66,54" fill="url(#ray-grad)" />

    <!-- Diagonals -->
    <polygon points="24,24 40,36 38,40 34,38" fill="url(#ray-grad)" />
    <polygon points="76,24 62,38 66,40 64,34" fill="url(#ray-grad)" />
    <polygon points="24,76 34,62 38,64 36,68" fill="url(#ray-grad)" />
    <polygon points="76,76 64,66 66,62 70,64" fill="url(#ray-grad)" />

    <!-- Center Radiant Orb -->
    <circle cx="50" cy="50" r="16" fill="url(#sun-core)" stroke="#fff" stroke-width="1.5" />
    <!-- Inner Corona Ring -->
    <circle cx="50" cy="50" r="10" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
  </g>

  <!-- Solar specks -->
  <circle cx="20" cy="36" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="80" cy="36" r="1.5" fill="#facc15" opacity="0.8" />
  <circle cx="78" cy="66" r="1.5" fill="#fef08a" opacity="0.7" />
  <circle cx="22" cy="64" r="1.5" fill="#facc15" opacity="0.7" />
</svg>
