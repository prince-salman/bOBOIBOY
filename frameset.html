<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>BoBoiBoy Universe | Classic Frameset Master Layout</title>
</head>

<!-- =========================================================================
     ACADEMIC REQUIREMENT: CLASSIC HTML FRAMESET IMPLEMENTATION
     Requirement: "Frame usage is a must and the 5 pages must be in the main/master
     frame and excluded from navigation and other parts."
     Top Frame: navFrame (nav.html - navigation is excluded from main frame)
     Bottom/Main Frame: mainFrame (home.html, characters.html, elements.html, series.html, contact.html)
     ========================================================================= -->
<frameset rows="76px,*" frameborder="0" border="0" framespacing="0">
  <!-- Navigation Frame (Excluded from main frame) -->
  <frame src="nav.html" name="navFrame" scrolling="no" noresize="noresize" title="Top Navigation Bar">
  <!-- Main Content Frame (Displays the 5 interconnected pages) -->
  <frame src="home.html" name="mainFrame" noresize="noresize" title="Main Content Window">
  
  <noframes>
    <body>
      <h2>BoBoiBoy Universe Portal</h2>
      <p>Your browser does not support frames. Please navigate directly to the <a href="home.html">Home Overview Page</a>.</p>
    </body>
  </noframes>
</frameset>
</html>
